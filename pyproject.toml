[project]
name = "certificate-generate"
version = "0.1.0"
description = "Generador masivo de certificados PDF a partir de una plantilla PDF y un Excel"
readme = "README.md"
authors = [
    { name = "Williams-adm", email = "i2310607@continental.edu.pe" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.163.1",
    "img2pdf>=0.6.3",
    "jinja2>=3.1.6",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.34",
    "reportlab>=5.1.0",
    "ruff>=0.17.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
certificate-generate = "certificate_generate:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
